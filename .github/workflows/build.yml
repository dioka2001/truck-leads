name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.leadscan --project-name truck_leads .
      - name: Apply app source
        run: |
          cp src/main.dart lib/main.dart
          cp src/pubspec.yaml pubspec.yaml
          rm -rf test
      - name: Add camera permission
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.CAMERA"/>#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: truck-leads-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
